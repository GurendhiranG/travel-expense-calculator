kind = "video"
previewPath = "/travel-expense-calculator-video/"
title = "Travel Expense Calculator — Animated Overview"
description = "A widescreen animated overview of the Travel Expense & Distance Calculator, showing route planning, live map routing, travel mode comparison, and clear expense recommendations."
version = "1.0.0"
id = "artifacts/travel-expense-calculator-video"
router = "path"
videoAspectRatio = "16:9"

[[services]]
name = "web"
paths = [ "/travel-expense-calculator-video/" ]
localPort = 21109

[services.development]
run = "pnpm --filter @workspace/travel-expense-calculator-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/travel-expense-calculator-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/travel-expense-calculator-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21109"
BASE_PATH = "/travel-expense-calculator-video/"